<style>
:root{--bg:#061019;--panel:#0c1924;--panel2:#0f202d;--line:#274759;--text:#edf7fb;--muted:#91a8b6;--gold:#f1c45b;--blue:#78d8ed;--green:#7fe5a8;--amber:#f3d88d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 90% 0,rgba(44,119,150,.18),transparent 30%),linear-gradient(180deg,#07131d,#04090e)}
button,input,select{font:inherit}header{position:sticky;top:0;z-index:30;background:rgba(6,16,25,.92);backdrop-filter:blur(13px);border-bottom:1px solid var(--line)}
.head{max-width:1450px;margin:auto;padding:14px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}
.btn,.search,select,input{border:1px solid var(--line);background:#0b1822;color:var(--text);border-radius:10px}.btn{padding:9px 11px;cursor:pointer}.search{width:100%;margin-top:12px;padding:12px 14px}
.layout{max-width:1450px;margin:auto;display:grid;grid-template-columns:245px 1fr;gap:22px;padding:22px 20px 55px}aside{position:sticky;top:121px;height:max-content;padding:10px;border:1px solid var(--line);background:rgba(12,25,36,.92);border-radius:16px}
nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:9px;cursor:pointer}nav button:hover,nav button.active{background:#142b3a;color:var(--text)}
section{display:none}.active-section{display:block}.hero{border:1px solid var(--line);border-radius:20px;padding:27px;background:linear-gradient(135deg,#15364a,#0d1b26)}.eyebrow{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:1.15px}
h1{margin:8px 0 12px;font-size:clamp(34px,5vw,57px);line-height:1}.hero p{max-width:900px;color:#bfd0d9;line-height:1.6}.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.hero-actions button{border:1px solid #365d70;background:#102b3a;color:#e1f8fd;padding:10px 13px;border-radius:10px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:18px}.stat{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.15)}.stat b{display:block;font-size:22px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}h2{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.filters{display:flex;gap:8px;flex-wrap:wrap}select{padding:9px 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:linear-gradient(180deg,#0f202c,#09151e)}.card h3{margin:0 0 7px;font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:11px;border:1px solid #30576d;background:#102a37;color:#a6e9f5;padding:4px 7px;border-radius:999px}.ver{border-color:#285e3c;background:#102c1d;color:#9bf0b7}.hist{border-color:#66542b;background:#2c2411;color:#efd890}.community{border-color:#66577a;background:#271f31;color:#d7c5ef}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}.kv span:first-child{color:var(--muted)}.kv b{text-align:right;max-width:65%}
.level{padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px;line-height:1.5}.price-dia{color:#8bdcff}.price-gold{color:var(--gold)}.price-eur{color:#a9f2c5}
.note{margin:14px 0;border:1px solid var(--line);background:#0c1a24;color:#bed0da;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.55}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tool{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;margin-top:5px;padding:10px}.result{margin-top:11px;border:1px solid #214052;background:#07151e;padding:11px;border-radius:9px;font-weight:800}
.hidden{display:none!important}footer{max-width:1450px;margin:auto;padding:0 20px 35px;color:#758a97;font-size:12px;line-height:1.55}
@media(max-width:1100px){.layout{grid-template-columns:1fr}aside{position:static}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.head,.layout{padding-left:12px;padding-right:12px}.grid,.stats,.tools,.fields{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>

const fmt=n=>typeof n==='number'?new Intl.NumberFormat(lang==='de'?'de-DE':'en-US').format(n):n;
const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
function tags(status='verified'){const cls=status==='verified'?'ver':status==='historical'?'hist':'community';const txt=status==='verified'?'Verified '+VERIFIED:status==='historical'?'Historical':'Community';return `<div class="tags"><span class="tag ${cls}">${txt}</span></div>`}
const card=(title,body,status='verified')=>`<article class="card searchable" data-search="${(title+' '+body).toLowerCase()}"><h3>${title}</h3>${tags(status)}${body}</article>`;

function staticText(){
const t=T[lang];
for(const [k,v] of Object.entries(t)){const e=document.getElementById(k)||document.querySelector(`[data-i18n="${k}"]`);if(e)e.textContent=v}
search.placeholder=t.search;brandSub.textContent=t.brandSub;shopNote.textContent=t.shopNote;footerText.textContent=t.footer;
cannonDestroy.innerHTML=`<option value="">${t.all}</option><option value="Nein">${t.undestroyable}</option><option value="Ja">${t.destroyable}</option>`;
cannonSort.innerHTML=`<option value="name">${t.sortName}</option><option value="damage">${t.sortDamage}</option><option value="spread">${t.sortSpread}</option>`;
}

function render(){
staticText();
countCannons.textContent=cannons.length;countHarpoons.textContent=harpoons.length;countDecks.textContent=decks.length;countSets.textContent=sets.length;countShop.textContent=shop.length;countGuild.textContent=guildRewards.length;
overviewGrid.innerHTML=[
card(lang==='de'?'Live-Datenbank':'Live Database',kv(lang==='de'?'Stand':'Date','August 2026')+kv(lang==='de'?'Verifiziert':'Verified',lang==='de'?'In-game Screenshots':'In-game screenshots')),
card(lang==='de'?'Datenstatus':'Data Status',kv('Verified',lang==='de'?'direkt im Spiel geprüft':'checked in-game')+kv('Historical',lang==='de'?'ältere Referenz':'older reference')+kv('Community',lang==='de'?'noch nicht vollständig verifiziert':'not fully verified yet'))
].join('');

shipsGrid.innerHTML=ships.map(s=>card(s.name,kv(lang==='de'?'Max. HP':'Max HP',fmt(s.hp))+kv(lang==='de'?'Tempo':'Speed',s.speed)+kv(lang==='de'?'Kanonen':'Cannons',s.c)+kv(lang==='de'?'Harpunen':'Harpoons',s.h)+kv(lang==='de'?'Krit. Ausweich / Resistenz':'Crit dodge / resistance',s.crit)+kv(lang==='de'?'Reichweite':'Range',s.range)+kv(lang==='de'?'Sichtweite':'Sight',s.sight)+kv(lang==='de'?'Preis / Quelle':'Price / source',s.price),s.status)).join('');

decksGrid.innerHTML=decks.map(d=>card(d.name,kv(lang==='de'?'Extra-Kanonen':'Extra cannons',d.c==='?'?'?':'+'+d.c)+kv(lang==='de'?'Extra-Harpunen':'Extra harpoons',d.h==='?'?'?':'+'+d.h)+kv(lang==='de'?'Unversenkbar':'Indestructible',d.u)+kv(lang==='de'?'Deckplatz':'Deck slot',d.slot)+(d.price?kv(lang==='de'?'Preis':'Price',d.price):'')+(d.durability?kv(lang==='de'?'Haltbarkeit':'Durability',d.durability):''))).join('');

upgradesGrid.innerHTML=upgrades.map(u=>card(u.name,kv(lang==='de'?'Preis':'Price',u.price)+kv(lang==='de'?'Effekt':'Effect',u.effect))).join('');

setsGrid.innerHTML=sets.map(s=>card(s.name,'<div class="sub">'+(lang==='de'?'Set-Gegenstände':'Set items')+'</div>'+s.pieces.map(p=>`<div class="level"><b>${p[0]}</b><br>${p[1]}</div>`).join('')+'<div class="sub" style="margin-top:10px">'+(lang==='de'?'Setstufen':'Set levels')+'</div>'+s.levels.map(l=>`<div class="level"><b>${l[0]}</b><br>${l[1]}</div>`).join(''))).join('');

renderCannons();

harpoonsGrid.innerHTML=harpoons.map(c=>card(`${c.name} · Lvl ${c.level}`,kv(lang==='de'?'Gegnertyp':'Target',lang==='de'?'Monster':'Monsters')+kv(lang==='de'?'Basis-Schaden':'Base damage',c.damage)+kv(lang==='de'?'Streuung':'Spread',c.spread+'%')+kv(lang==='de'?'Zerstörbar':'Destructible',c.d==='Ja'?(lang==='de'?'Ja':'Yes'):(lang==='de'?'Nein':'No')))).join('');

shopGrid.innerHTML=shop.map(i=>{

if(i[1]==='gold')price=kv(lang==='de'?'Normalpreis':'Normal price',`<span class="price-gold">${fmt(i[2])} 🟡</span>`)+kv(lang==='de'?'Mit 25% Gildenrabatt':'With 25% guild discount',`<span class="price-gold">${fmt(i[3])} 🟡</span>`);
if(i[1]==='eur')price=kv(lang==='de'?'Preis':'Price',`<span class="price-eur">€ ${String(i[2]).replace('.',',')}</span>`);
return card(i[0],price+kv(lang==='de'?'Effekt / Info':'Effect / info',i[4]));
}).join('');

guildGrid.innerHTML=guildRewards.map(g=>card((lang==='de'?'Gilden-Level ':'Guild Level ')+g[0],kv(lang==='de'?'Belohnung':'Reward',g[1]))).join('');

shipSelect.innerHTML=ships.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');

function renderCannons(){
let a=cannons.filter(c=>!cannonDestroy.value||c.d===cannonDestroy.value);
if(cannonSort.value==='damage')a=[...a].sort((x,y)=>y.damage-x.damage);else if(cannonSort.value==='spread')a=[...a].sort((x,y)=>x.spread-y.spread);else a=[...a].sort((x,y)=>x.name.localeCompare(y.name,'de'));
cannonsGrid.innerHTML=a.map(c=>card(`${c.name} · Lvl ${c.level}`,kv(lang==='de'?'Gegnertyp':'Target',lang==='de'?'Schiffe':'Ships')+kv(lang==='de'?'Basis-Schaden':'Base damage',c.damage)+kv(lang==='de'?'Streuung':'Spread',c.spread+'%')+kv(lang==='de'?'Zerstörbar':'Destructible',c.d==='Ja'?(lang==='de'?'Ja':'Yes'):(lang==='de'?'Nein':'No')))).join('');applySearch();
}
function switchSection(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.sec===id));document.querySelectorAll('main section').forEach(s=>s.classList.remove('active-section'));document.getElementById(id).classList.add('active-section');window.scrollTo({top:0,behavior:'smooth'})}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchSection(b.dataset.sec)});document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>switchSection(b.dataset.jump)));
function applySearch(){const q=search.value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(el=>el.classList.toggle('hidden',!!q&&!el.dataset.search.includes(q)))}search.addEventListener('input',applySearch);cannonDestroy.addEventListener('change',renderCannons);cannonSort.addEventListener('change',renderCannons);

function calc(){
const c=cannons[+damageCannon.value||0],count=+damageCount.value||0,mult=+ammoMultiplier.value||1,bonus=1+(+bonusDamage.value||0)/100;
damageResult.textContent=(lang==='de'?'Theoretischer Basisschaden: ':'Theoretical base damage: ')+fmt(Math.round(c.damage*count*mult*bonus));
const s=ships[+shipSelect.value||0];const base=typeof s.c==='number'?s.c:0;const total=base+(+deckBonus.value||0)+(+setBonus.value||0)+(+otherBonus.value||0);
maxCannonsResult.textContent=(lang==='de'?'Kanonen gesamt: ':'Total cannons: ')+fmt(total)+(typeof s.c!=='number'?(lang==='de'?' · Basiswert noch offen':' · base value still unknown'):'');
}
[damageCannon,damageCount,ammoMultiplier,bonusDamage,shipSelect,deckBonus,setBonus,otherBonus].forEach(x=>x.addEventListener('input',calc));
langBtn.addEventListener('click',()=>{lang=lang==='de'?'en':'de';langBtn.textContent=lang==='de'?'EN':'DE';document.documentElement.lang=lang;render()});
render();
</script>
